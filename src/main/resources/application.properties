#########################
# DATABASE
#########################
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DATABASE_USERNAME}
quarkus.datasource.password=${DATABASE_PASSWORD}
quarkus.datasource.jdbc.url=${DATABASE_URL}


quarkus.hibernate-orm.database.generation=update

#########################
# LOGGING
#########################
quarkus.hibernate-orm.log.sql=false

#########################
# CORS
#########################
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

#########################
# SERVER CONFIG
#########################
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0

#########################
# JWT CONFIG
#########################
quarkus.smallrye-jwt.enabled=true



smallrye.jwt.sign.key.location=classpath:privateKey_pkcs8.pem
mp.jwt.verify.publickey.location=classpath:publicKey.pem

mp.jwt.verify.issuer=esangam

quarkus.log.category."io.smallrye.jwt".level=DEBUG

#########################
# OPENAPI / SWAGGER
#########################
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
