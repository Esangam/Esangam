# H2 in-memory DB
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:esangam;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true

# JWT
quarkus.smallrye-jwt.enabled=true
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
mp.jwt.verify.issuer=esangam-auth

# Secure all /api/* endpoints
quarkus.http.auth.permission.esangam.paths=/api/*
quarkus.http.auth.permission.esangam.policy=authenticated

# === JWT SIGNING (FIXED NAMES) ===
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.sign.key.algorithm=RS256

# === CORS for React UI on http://localhost:5173 ===
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Location
quarkus.http.cors.access-control-allow-credentials=true

