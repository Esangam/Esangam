# ------------------------
# HTTP & Server Configuration
# ------------------------
quarkus.http.port=8080
quarkus.http.cors=true

# ------------------------
# Datasource (PostgreSQL)
# ------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=root
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/Esangam
quarkus.hibernate-orm.database.generation=update

# ------------------------
# Hibernate ORM Settings
# ------------------------
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.show-sql=true

# ------------------------
# JWT Security (Optional, if using SmallRye JWT)
# ------------------------
#quarkus.smallrye-jwt.enabled=true
#quarkus.smallrye-jwt.auth-mechanism=MP-JWT
#quarkus.smallrye-jwt.public-key.location=C:/Users/Raneesh/Desktop/esangam/src/main/resources/META-INF/resources/publicKey.pem

# ------------------------
# Role-based authorization config
# ------------------------
## Admin secured paths
#quarkus.http.auth.permission.admin.paths=/api/admin/*
#quarkus.http.auth.permission.admin.policy=roles
#quarkus.http.auth.permission.admin.roles-allowed=admin
#
## Member secured paths
#quarkus.http.auth.permission.member.paths=/api/member/*
#quarkus.http.auth.permission.member.policy=roles
#quarkus.http.auth.permission.member.roles-allowed=member
#
## Enable security
#quarkus.security.users.embedded.enabled=true
#
## Embedded users for quick testing (remove in prod)
#quarkus.security.users.embedded.plain-text=true
#quarkus.security.users.embedded.users.admin=password123
#quarkus.security.users.embedded.roles.admin=admin
#quarkus.security.users.embedded.users.member=password123
#quarkus.security.users.embedded.roles.member=member

# ------------------------
# OpenAPI / Swagger UI (Optional)
# ------------------------
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
